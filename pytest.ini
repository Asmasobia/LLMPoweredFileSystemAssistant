; pytest configuration.
;
; The main reason this file exists is `testpaths`. Without it, a bare `pytest`
; walks the entire tree — including `resumes/`, `chroma_db/` and the notebook
; checkpoints — which is slow and occasionally picks up something that merely
; looks like a test. Naming the directory makes `pytest` and `pytest tests/`
; behave identically, and a command that means the same thing however you type it
; is a command people keep using.

[pytest]
testpaths = tests

; Show the reason next to every skipped test (-rs).
;
; This is here on purpose rather than for tidiness. One test in this suite —
; symlink escape, the single most important containment case — cannot run on
; Windows without Developer Mode, so it skips. A silent skip reads exactly like a
; pass in the summary line, and "63 passed" would then be quietly overstating what
; was actually verified. Making skips loud keeps the test report honest about the
; difference between "checked" and "not checked here".
addopts = -rs --strict-markers

; --strict-markers turns a typo'd @pytest.mark.slwo into an error instead of a
; silently-ignored decorator. Test selection that fails open is how a subset of a
; suite stops running without anyone noticing.

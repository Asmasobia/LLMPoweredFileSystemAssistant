# Postgres + pgvector for the résumé store.
#
#   docker compose up -d        # then: export DATABASE_URL=postgresql://rag:rag@localhost:5432/rag
#
# The image tag is pinned to the same Postgres (16) and pgvector (0.6.2) that
# `pgserver` runs on machines without Docker, so both setups behave the same.
services:
  db:
    image: pgvector/pgvector:0.6.2-pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag   # local development only
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:

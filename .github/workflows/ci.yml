name: CI

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same Postgres and pgvector versions as docker-compose.yml and pgserver.
        image: pgvector/pgvector:0.6.2-pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      # Chroma downloads the all-MiniLM-L6-v2 ONNX model (~80 MB) on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-all-MiniLM-L6-v2

      - name: Tests
        run: pytest

      # Fails if recall@5 or MRR drops below evals/thresholds.json, or if any
      # label is still an unreviewed draft. No API key needed: retrieval only.
      # The LLM grounding judge is not run in CI (it costs API calls and is not
      # deterministic); see evals/grounding_eval.py.
      - name: Retrieval eval (regression gate)
        run: python evals/retrieval_eval.py --check evals/thresholds.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-results
          path: evals/results/retrieval.json
